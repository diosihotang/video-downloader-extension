<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video Downloader Pro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <img src="icons/icon48.png" alt="" class="header-icon" />
    <div class="header-text">
      <h1>Video Downloader</h1>
      <p id="page-host">…</p>
    </div>
    <button class="btn-ghost" id="btn-clear" title="Clear list">Clear</button>
  </header>

  <main id="media-list"></main>

  <div class="empty" id="empty-state" hidden>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="23 7 16 12 23 17 23 7"></polygon>
      <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
    </svg>
    <p>No video found yet</p>
    <small>Play the video on this page, then open this popup again.</small>
  </div>

  <script src="popup.js"></script>
</body>
</html>
